<style>
/* Layout: app mobile-first com navegação inferior; a partir de 1024 px passa a cabeçalho com
   navegação e grelhas de 3 a 4 colunas. Breakpoints do projeto: 768 · 1024 · 1280 px. */
:root {
  /* Escalas de 12 passos geradas em OKLCH a partir do verde e do laranja da direção A.
     1–2 fundos · 3–5 componentes · 6–8 bordas · 9–10 sólidos · 11–12 texto */
  --verde-1: #F9FFFA; --verde-2: #F1FBF3; --verde-3: #E3F5E6; --verde-4: #D5EFD9;
  --verde-5: #C5E8CB; --verde-6: #B4DDBB; --verde-7: #9ECFA7; --verde-8: #7DBA8A;
  --verde-9: #1F7A3D; --verde-10: #076D30; --verde-11: #156D34; --verde-12: #063114;

  --laranja-1: #FFFCFB; --laranja-2: #FFF6F3; --laranja-3: #FFEBE4; --laranja-4: #FFDFD5;
  --laranja-5: #FFD1C3; --laranja-6: #FFC0AC; --laranja-7: #FBA98F; --laranja-8: #EE8A6B;
  --laranja-9: #C2410C; --laranja-10: #AF3600; --laranja-11: #9D3000; --laranja-12: #4A1200;

  --neutro-1: #FCFEFD; --neutro-2: #F8FAF8; --neutro-3: #EFF2EF; --neutro-4: #E6EAE7;
  --neutro-5: #DDE2DE; --neutro-6: #D3D8D4; --neutro-7: #C4CAC5; --neutro-8: #ADB4AE;
  --neutro-9: #878E88; --neutro-10: #7B827C; --neutro-11: #5F6760; --neutro-12: #1A211B;

  /* Cores de estado (só os passos usados) */
  --ambar-3: #FDEDDE; --ambar-6: #EDCAA8; --ambar-9: #A16207; --ambar-11: #814D00;
  --azul-3: #E7F1FF; --azul-6: #B6D3FF; --azul-9: #1E5BB8; --azul-11: #1D57AE;
  --vermelho-3: #FFEAE8; --vermelho-6: #FFBFB7; --vermelho-9: #C42B2B; --vermelho-11: #A9141B;
  --branco: #FFFFFF;

  /* Tokens semânticos: os componentes só usam estes */
  --bg: var(--neutro-1);
  --surface: var(--branco);
  --tile: var(--neutro-3);
  --tile-fill: var(--surface);
  --fill: var(--neutro-3);
  --fill-hover: var(--neutro-4);
  --border: var(--neutro-6);
  --border-field: var(--neutro-9);
  --text: var(--neutro-12);
  --text-muted: var(--neutro-11);
  --brand: var(--verde-9);
  --brand-hover: var(--verde-10);
  --brand-text: var(--verde-11);
  --brand-soft: var(--verde-3);
  --on-brand: var(--branco);
  --live: var(--laranja-9);
  --live-hover: var(--laranja-10);
  --live-text: var(--laranja-11);
  --live-soft: var(--laranja-3);
  --on-live: var(--branco);
  --hero-bg: var(--verde-12);
  --hero-fg: var(--verde-1);
  --hero-muted: var(--verde-6);
  --hero-line: var(--verde-11);
  --focus: var(--verde-9);
  --glass: color-mix(in srgb, var(--surface) 76%, transparent);
  --scrim: rgb(13 16 14 / 0.45);
  --shadow-rgb: 22 33 24;
  --pendente-bg: var(--ambar-3); --pendente-fg: var(--ambar-11);
  --confirmada-bg: var(--azul-3); --confirmada-fg: var(--azul-11);
  --pronta-bg: var(--verde-3); --pronta-fg: var(--verde-11);
  --entregue-bg: var(--neutro-3); --entregue-fg: var(--neutro-11);
  --erro-bg: var(--vermelho-3); --erro-fg: var(--vermelho-11); --erro: var(--vermelho-9);
  --cat-fruta: var(--verde-3); --cat-horticolas: var(--verde-4); --cat-mel: var(--ambar-3);
  --cat-vinho: var(--azul-3); --cat-queijo: var(--ambar-3); --cat-padaria: var(--laranja-3);
  --cat-outros: var(--neutro-4);

  /* Tipografia: Bricolage Grotesque só nos títulos; Plus Jakarta Sans no resto */
  --font-display: "Bricolage Grotesque", "Plus Jakarta Sans", system-ui, sans-serif;
  --font-body: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --t-display: clamp(2.15rem, 1.55rem + 2.6vw, 3.5rem);
  --t-h1: 1.75rem; --t-h2: 1.375rem; --t-h3: 1.125rem;
  --t-body: 1rem; --t-small: 0.875rem; --t-caption: 0.75rem;

  /* Forma, espaço, elevação e movimento */
  --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;
  --shadow-1: 0 1px 2px rgb(var(--shadow-rgb) / 0.07), 0 1px 1px rgb(var(--shadow-rgb) / 0.04);
  --shadow-2: 0 12px 32px -12px rgb(var(--shadow-rgb) / 0.30), 0 2px 6px rgb(var(--shadow-rgb) / 0.06);
  --dur-1: 120ms; --dur-2: 200ms; --dur-3: 320ms;
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-mola: cubic-bezier(0.34, 1.56, 0.64, 1);
  --topo-h: 60px;
  --nav-h: 68px;
}
/* Modo escuro: só se redefinem as escalas e meia dúzia de papéis; o resto deriva sozinho */

    --neutro-9: #727A73; --neutro-10: #7E867F; --neutro-11: #B5BDB6; --neutro-12: #ECF0EC;
    --ambar-3: #271D12; --ambar-6: #4A331B; --ambar-9: #A66611; --ambar-11: #EDB67E;
    --azul-3: #161F2E; --azul-6: #23395A; --azul-9: #3572D1; --azul-11: #9FC4FF;
    --vermelho-3: #2F1715; --vermelho-6: #5A2622; --vermelho-9: #D43C39; --vermelho-11: #FFA89F;
    --surface: var(--neutro-3); --tile: var(--neutro-3); --tile-fill: var(--neutro-5);
    --fill: var(--neutro-4); --fill-hover: var(--neutro-5);
    --hero-bg: var(--verde-3); --hero-fg: var(--neutro-12); --hero-muted: var(--verde-11); --hero-line: var(--verde-6);
    --focus: var(--verde-11); --scrim: rgb(0 0 0 / 0.62); --shadow-rgb: 0 0 0;
    --cat-fruta: var(--verde-4); --cat-horticolas: var(--verde-5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --verde-1: #0C110D; --verde-2: #101812; --verde-3: #162218; --verde-4: #1A2B1E;
  --verde-5: #1E3523; --verde-6: #24402A; --verde-7: #2D5135; --verde-8: #396A44;

  --ambar-3: #271D12; --ambar-6: #4A331B; --ambar-9: #A66611; --ambar-11: #EDB67E;

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 88px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: var(--t-body); line-height: 1.55;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
h1, h2, h3 {
  font-family: var(--font-display); font-weight: 750; line-height: 1.08;
  letter-spacing: -0.025em; margin: 0; text-wrap: balance;
}
p { margin: 0; }
[hidden] { display: none !important; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
svg { display: block; max-width: 100%; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.saltar {
  position: absolute; left: 16px; top: -120px; z-index: 100; padding: 10px 18px;
  border-radius: var(--r-full); background: var(--brand); color: var(--on-brand); font-weight: 700;
}
.saltar:focus { top: calc(env(safe-area-inset-top, 0px) + 8px); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
.ic {
  font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal;
  font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap; direction: ltr; width: 1em; height: 1em;
  overflow: hidden; flex: none; user-select: none; -webkit-font-smoothing: antialiased;
  font-feature-settings: "liga"; font-variation-settings: "FILL" 0, "wght" 450, "GRAD" 0, "opsz" 24;
}
.ic.cheio { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.ic.m { font-size: 20px; }
.ic.p { font-size: 18px; }

/* ---------- Estrutura: cabeçalho, vista e navegação inferior ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-bottom: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  view-transition-name: topo;
}
.topo-interior {
  height: var(--topo-h); display: flex; align-items: center; gap: var(--s-3);
  padding-inline: 16px; max-width: 1240px; margin-inline: auto;
}
.marca {
  display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
  font-family: var(--font-display); font-weight: 800; font-size: 1.125rem; letter-spacing: -0.02em;
}
.marca-simbolo {
  width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
  background: var(--brand); color: var(--on-brand);
}
.marca { min-width: 0; }
.marca > span:last-child { overflow: hidden; text-overflow: ellipsis; }
.topo-nav, .topo-interior .topo-pesquisa, .topo-acoes .so-desktop { display: none; }
.topo-acoes { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.btn-icone {
  width: 44px; height: 44px; border-radius: var(--r-full); border: 0; background: transparent;
  display: inline-grid; place-items: center; position: relative; flex: none;
  transition: background var(--dur-1) var(--ease-out);
}
.btn-icone:hover { background: var(--fill); }
.ponto {
  position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--live); box-shadow: 0 0 0 2px var(--bg);
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  font-weight: 800; font-size: 0.8125rem; background: var(--brand-soft); color: var(--brand-text);
}
.vista {
  max-width: 1240px; margin-inline: auto;
  padding: var(--s-4) 16px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + var(--s-8));
}
.nav-inferior {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--glass);
  -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
  view-transition-name: nav-inferior;
}
.nav-lista {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--nav-h);
  max-width: 560px; margin: 0 auto; padding: 0 4px; list-style: none;
}
.nav-item {
  width: 100%; height: 100%; border: 0; background: none; position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-size: 0.6875rem; font-weight: 650; color: var(--text-muted);
}
.nav-icone {
  width: 56px; height: 30px; border-radius: var(--r-full); display: grid; place-items: center;
  position: relative; transition: background var(--dur-2) var(--ease-out);
}
.nav-item[aria-current="page"] { color: var(--brand-text); }
.nav-item[aria-current="page"] .nav-icone { background: var(--brand-soft); }
.nav-item[aria-current="page"] .ic { font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.contador {
  position: absolute; top: -4px; right: 6px; min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: var(--r-full); display: grid; place-items: center;
  background: var(--live); color: var(--on-live); font-size: 0.6875rem; font-weight: 800;
  box-shadow: 0 0 0 2px var(--bg);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .topo, .nav-inferior { background: var(--surface); }
}
@media (prefers-reduced-transparency: reduce) {
  .topo, .nav-inferior { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (min-width: 768px) {
  .vista, .topo-interior { padding-inline: 24px; }
}
@media (min-width: 1024px) {
  :root { --topo-h: 72px; }
  .nav-inferior { display: none; }
  .vista { padding: var(--s-6) 32px var(--s-10); }
  .topo-interior { padding-inline: 32px; gap: var(--s-5); }
  .topo-nav { display: flex; gap: 2px; }
  .topo-nav a {
    padding: 9px 14px; border-radius: var(--r-full); font-weight: 650; font-size: var(--t-small);
    color: var(--text-muted); display: inline-flex; align-items: center; gap: 6px;
  }
  .topo-nav a:hover { background: var(--fill); color: var(--text); }
  .topo-nav a[aria-current="page"] { background: var(--brand-soft); color: var(--brand-text); }
  .topo-interior .topo-pesquisa { display: flex; flex: 1; max-width: 400px; margin-left: auto; }
  .topo-acoes { margin-left: 0; }
  .topo-acoes .so-desktop { display: inline-grid; }
}
@media (min-width: 1280px) {
  .vista, .topo-interior { padding-inline: 40px; }
}

/* ---------- Componentes ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 22px; border: 0; border-radius: var(--r-full);
  font-weight: 700; font-size: 0.9375rem; white-space: nowrap; text-align: center;
  transition: background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out), box-shadow var(--dur-2) var(--ease-out);
}
.btn:active { transform: scale(0.97); }
.btn-principal { background: var(--brand); color: var(--on-brand); }
.btn-principal:hover { background: var(--brand-hover); }
.btn-direto { background: var(--live); color: var(--on-live); }
.btn-direto:hover { background: var(--live-hover); }
.btn-secundario { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1.5px var(--border); }
.btn-secundario:hover { box-shadow: inset 0 0 0 1.5px var(--border-field); }
.btn-suave { background: var(--brand-soft); color: var(--brand-text); }
.btn-suave:hover { background: var(--verde-4); }
.btn-fantasma { background: transparent; color: var(--brand-text); padding-inline: 12px; }
.btn-fantasma:hover { background: var(--fill); }
.btn-pequeno { height: 38px; padding: 0 14px; font-size: var(--t-small); }
.btn-bloco { width: 100%; }
.btn-adicionar {
  width: 40px; height: 40px; flex: none; border: 0; border-radius: 50%;
  display: inline-grid; place-items: center; background: var(--brand); color: var(--on-brand);
  position: relative; z-index: 1;
  transition: background var(--dur-1) var(--ease-out), transform var(--dur-1) var(--ease-out);
}
.btn-adicionar:hover { background: var(--brand-hover); }
.btn-adicionar:active { transform: scale(0.88); }

.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; flex: none;
  border: 0; border-radius: var(--r-full); background: var(--fill); color: var(--text);
  font-weight: 650; font-size: var(--t-small); white-space: nowrap;
  transition: background var(--dur-1) var(--ease-out), color var(--dur-1) var(--ease-out);
}
.chip:hover { background: var(--fill-hover); }
.chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); }
.chip-removivel { background: var(--brand-soft); color: var(--brand-text); padding-right: 8px; }
.chip-removivel:hover { background: var(--verde-4); }
.chips-rolagem {
  display: flex; gap: var(--s-2); overflow-x: auto; scrollbar-width: none;
  margin-inline: -16px; padding: 2px 16px; scroll-padding-inline: 16px;
}
.chips-rolagem::-webkit-scrollbar { display: none; }

.etiqueta {
  display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px;
  border-radius: var(--r-full); font-size: 0.75rem; font-weight: 750; white-space: nowrap;
  background: var(--surface); color: var(--text);
}
.etiqueta-bio { background: var(--brand-soft); color: var(--brand-text); }
.etiqueta-direto { background: var(--live); color: var(--on-live); }
.etiqueta-suave { background: var(--live-soft); color: var(--live-text); }
.bolinha { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

.estado {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
  border-radius: var(--r-full); font-size: 0.8125rem; font-weight: 750; white-space: nowrap;
}
.estado-pendente { background: var(--pendente-bg); color: var(--pendente-fg); }
.estado-confirmada { background: var(--confirmada-bg); color: var(--confirmada-fg); }
.estado-pronta { background: var(--pronta-bg); color: var(--pronta-fg); }
.estado-entregue { background: var(--entregue-bg); color: var(--entregue-fg); }

.campo-grupo { display: grid; gap: 6px; }
.rotulo { font-size: var(--t-small); font-weight: 700; }
.campo {
  width: 100%; height: 50px; padding: 0 16px; border-radius: var(--r-md);
  border: 1.5px solid var(--border-field); background: var(--surface); color: var(--text); font-size: 1rem;
  transition: border-color var(--dur-1) var(--ease-out), box-shadow var(--dur-1) var(--ease-out);
}
.campo:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand) 22%, transparent); }
.campo::placeholder { color: var(--text-muted); opacity: 1; }

.pesquisa {
  display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 6px 0 18px;
  border-radius: var(--r-full); background: var(--surface); box-shadow: inset 0 0 0 1.5px var(--border);
  transition: box-shadow var(--dur-1) var(--ease-out);
}
.pesquisa:focus-within { box-shadow: inset 0 0 0 2px var(--brand), 0 0 0 4px color-mix(in srgb, var(--brand) 18%, transparent); }
.pesquisa input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; outline: none; font-size: 1rem; }
.pesquisa input::placeholder { color: var(--text-muted); opacity: 1; }
.pesquisa .ic { color: var(--text-muted); }
.btn-pesquisar {
  height: 42px; padding: 0 16px; border: 0; border-radius: var(--r-full); flex: none;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: var(--t-small);
  background: var(--brand); color: var(--on-brand);
}
.btn-pesquisar:hover { background: var(--brand-hover); }
.btn-pesquisar .ic { color: inherit; }
.pesquisa-compacta { height: 44px; padding-left: 14px; padding-right: 4px; }
.pesquisa-compacta .btn-pesquisar { height: 36px; width: 36px; padding: 0; justify-content: center; }

.interruptor { display: flex; align-items: center; justify-content: space-between; gap: var(--s-3); min-height: 48px; cursor: pointer; font-weight: 650; }
.interruptor input {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none; cursor: pointer;
  width: 52px; height: 32px; border-radius: var(--r-full); background: var(--neutro-7); position: relative;
  transition: background var(--dur-2) var(--ease-out);
}
.interruptor input::after {
  content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%;
  background: var(--branco); box-shadow: var(--shadow-1); transition: transform var(--dur-2) var(--ease-mola);
}
.interruptor input:checked { background: var(--brand); }
.interruptor input:checked::after { transform: translateX(20px); }

.segmentado {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px;
  border-radius: var(--r-full); background: var(--fill);
}
.segmentado button {
  height: 40px; border: 0; border-radius: var(--r-full); background: transparent; color: var(--text-muted);
  font-weight: 700; font-size: var(--t-small); display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 8px; white-space: nowrap; transition: background var(--dur-2) var(--ease-out), color var(--dur-2) var(--ease-out);
}
.segmentado button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow-1); }

.passos { display: inline-flex; align-items: center; gap: 2px; height: 46px; padding: 3px; border-radius: var(--r-full); background: var(--fill); flex: none; }
.passos button { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--surface); display: inline-grid; place-items: center; box-shadow: var(--shadow-1); }
.passos output { min-width: 52px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; font-size: var(--t-small); }

/* Cartão de produto */
.grelha-produtos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-6) var(--s-3); }
.cartao-produto { position: relative; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ilu-caixa {
  position: relative; display: grid; place-items: center; overflow: hidden; max-width: 100%;
  aspect-ratio: 1 / 0.86; border-radius: var(--r-lg); background: var(--cat, var(--tile));
}
.ilu-caixa svg { width: 64%; height: 64%; transition: transform var(--dur-3) var(--ease-mola); }
.cartao-produto:hover .ilu-caixa svg { transform: scale(1.06) rotate(-3deg); }
.cartao-produto .etiquetas { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 1; }
.cartao-produto h3 { font-family: var(--font-body); font-size: 0.9375rem; font-weight: 750; letter-spacing: -0.01em; line-height: 1.25; margin-top: 4px; }
.cartao-produto .cobrir::after { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); }
.origem { font-size: 0.8125rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linha-preco { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); margin-top: auto; padding-top: 2px; }
.preco { font-weight: 800; font-size: 1.0625rem; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
.preco small { font-weight: 600; font-size: 0.75rem; color: var(--text-muted); margin-left: 2px; }
.avaliacao { display: inline-flex; align-items: center; gap: 2px; font-size: 0.75rem; font-weight: 750; color: var(--text-muted); }
.avaliacao .ic { font-size: 15px; color: var(--ambar-9); font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }

/* Mosaico (bloco do bento) */
.mosaico { position: relative; min-width: 0; overflow: hidden; border-radius: var(--r-xl); background: var(--tile); padding: var(--s-5); }

/* Folha que sobe do fundo (filtros) */
.folha {
  border: 0; padding: 0; margin: auto 0 0; width: 100%; max-width: 100%; max-height: 88vh;
  border-radius: var(--r-xl) var(--r-xl) 0 0; background: var(--surface); color: var(--text);
  box-shadow: var(--shadow-2); overflow: auto; overscroll-behavior: contain;
}
.folha[open] { animation: subir var(--dur-3) var(--ease-out); }
.folha::backdrop { background: var(--scrim); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
.folha[open]::backdrop { animation: aparecer var(--dur-3) var(--ease-out); }
.folha-pega { width: 42px; height: 5px; border-radius: 3px; background: var(--neutro-7); margin: 10px auto 0; }
.folha-cabecalho { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 6px 12px 6px 20px; background: var(--surface); }
.folha-cabecalho h2 { font-size: var(--t-h2); }
.folha-corpo { display: grid; gap: var(--s-6); padding: 6px 20px 20px; }
.folha-rodape {
  position: sticky; bottom: 0; display: flex; gap: var(--s-3);
  padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--border);
}
.folha-rodape .btn-principal { flex: 1; }
.grupo-filtro { display: grid; gap: var(--s-3); }
.grupo-filtro > h3 { font-family: var(--font-body); font-size: var(--t-small); font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-muted); }
.lista-chips { display: flex; flex-wrap: wrap; gap: var(--s-2); }
.intervalo { width: 100%; accent-color: var(--brand); }
@keyframes subir { from { transform: translateY(100%); } }
@keyframes aparecer { from { opacity: 0; } }

/* Avisos (toasts) e alertas */
.avisos {
  position: fixed; z-index: 60; left: 12px; right: 12px; display: grid; gap: 8px; pointer-events: none;
  top: calc(env(safe-area-inset-top, 0px) + var(--topo-h) + 8px);
}
.aviso {
  pointer-events: auto; display: flex; align-items: flex-start; gap: 12px; padding: 14px 12px 14px 16px;
  border-radius: var(--r-lg); background: var(--neutro-12); color: var(--neutro-1); box-shadow: var(--shadow-2);
  font-size: var(--t-small); line-height: 1.45; animation: entrar-aviso var(--dur-3) var(--ease-mola);
}
.aviso > .ic { color: var(--verde-7); margin-top: -1px; }
.aviso p { flex: 1; min-width: 0; }
.aviso-acao { flex: none; border: 0; background: transparent; color: inherit; font-weight: 800; text-decoration: underline; padding: 2px 6px; }
.aviso.sair { animation: sair-aviso 180ms ease-in forwards; }
@keyframes entrar-aviso { from { opacity: 0; transform: translateY(-12px) scale(0.98); } }
@keyframes sair-aviso { to { opacity: 0; transform: translateY(-8px); } }
.alerta { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border-radius: var(--r-md); font-size: var(--t-small); font-weight: 650; }
.alerta-erro { background: var(--erro-bg); color: var(--erro-fg); }
.alerta-ok { background: var(--brand-soft); color: var(--brand-text); }

/* Anel da contagem decrescente */
.anel { position: relative; width: var(--anel, 64px); height: var(--anel, 64px); flex: none; }
.anel svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.anel .anel-fundo { stroke: color-mix(in srgb, currentColor 16%, transparent); }
.anel .anel-progresso { stroke: var(--live); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.anel .ic { position: absolute; inset: 0; margin: auto; color: var(--live); }

/* Pequenas animações */
.pulsar { animation: pulsar 1.6s ease-in-out infinite; }
.saltinho { animation: saltinho 480ms var(--ease-mola); }
.tremer { animation: tremer 360ms var(--ease-out); }
.realce { animation: realce 1.4s var(--ease-out); }
@keyframes pulsar { 50% { opacity: 0.35; transform: scale(0.8); } }
@keyframes saltinho { 40% { transform: scale(1.14); } }
@keyframes tremer { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
@keyframes realce { from { background: var(--live-soft); } }

/* Secções e títulos */
.secao { display: grid; gap: var(--s-4); margin-top: var(--s-10); }
.secao-cabecalho { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.secao-cabecalho h2 { font-size: var(--t-h2); }
.ligacao { display: inline-flex; align-items: center; gap: 2px; font-weight: 750; font-size: var(--t-small); color: var(--brand-text); white-space: nowrap; }
.ligacao:hover { text-decoration: underline; }
.titulo-pagina { font-size: var(--t-h1); }
.subtitulo { color: var(--text-muted); font-size: var(--t-small); }

/* ---------- Início (bento) ---------- */
.sobretitulo { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-muted); }
a.mosaico, button.mosaico { display: grid; color: inherit; text-align: left; border: 0; font: inherit; cursor: pointer; transition: transform var(--dur-2) var(--ease-mola); }
a.mosaico:hover, button.mosaico:hover { transform: translateY(-2px); }
@media (min-width: 1280px) { .limite-4 > :nth-child(n + 5) { display: none; } }
.inicio-topo { display: grid; gap: var(--s-4); padding-top: var(--s-2); }
.saudacao { display: flex; align-items: center; gap: 6px; font-size: var(--t-small); font-weight: 750; color: var(--brand-text); }
.titulo-heroi { font-size: var(--t-display); font-weight: 800; letter-spacing: -0.04em; line-height: 0.96; }
.titulo-heroi em { font-style: normal; color: var(--brand); }
.inicio-topo .subtitulo { font-size: 0.9375rem; max-width: 46ch; }
.bento { display: grid; gap: var(--s-3); grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: var(--s-6); }
.mosaico-direto {
  grid-column: 1 / -1; display: grid; gap: var(--s-4); align-content: space-between;
  background: var(--hero-bg); color: var(--hero-fg); border: 1px solid var(--hero-line);
}
.mosaico-direto .linha-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--s-2); }
.assistir { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t-small); font-weight: 650; color: var(--hero-muted); }
.mosaico-direto h2 { font-size: 1.625rem; max-width: 15ch; }
.origem-lote { margin-top: 6px; color: var(--hero-muted); font-size: var(--t-small); font-weight: 600; }
.numeros-lote { display: flex; align-items: flex-end; gap: var(--s-4); }
.rotulo-pequeno { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: var(--hero-muted); }
.valor-grande { font-size: 2.25rem; font-weight: 800; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.contagem { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.contagem .tempo { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.mosaico-direto .anel { --anel: 44px; color: var(--hero-fg); }
.lote-ilustracao { display: none; position: absolute; right: 22px; top: 22px; width: 32%; max-width: 210px; pointer-events: none; }
.mosaico-produtor { display: grid; gap: var(--s-3); align-content: start; }
.mosaico-produtor .avatar { width: 46px; height: 46px; font-size: 0.9375rem; background: var(--surface); color: var(--pendente-fg); }
.citacao { font-family: var(--font-display); font-weight: 650; font-size: 1.0625rem; line-height: 1.2; letter-spacing: -0.01em; }
.mosaico-epoca { display: grid; gap: var(--s-2); align-content: start; background: var(--cat-mel); }
.mosaico-epoca .ilus { display: flex; gap: 2px; height: 42px; }
.mosaico-epoca .ilus svg { width: 42px; height: 42px; flex: none; }
.mosaico-epoca h3, .mosaico-produtor h3 { font-family: var(--font-body); font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; }
.mosaico-categorias { grid-column: 1 / -1; padding: var(--s-4); }
.categorias { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-2); }
.categoria {
  display: grid; justify-items: center; gap: 6px; padding: 12px 4px; border: 0; border-radius: var(--r-lg);
  background: var(--tile-fill); color: var(--text); font-weight: 700; font-size: 0.8125rem;
  transition: transform var(--dur-2) var(--ease-mola);
}
.categoria:hover { transform: translateY(-2px); }
.ilu-mini { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--cat); }
.ilu-mini svg { width: 32px; height: 32px; }
.mosaico-proximo { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--s-4); flex-wrap: wrap; }
.data-caixa { width: 58px; height: 62px; flex: none; display: grid; place-content: center; text-align: center; line-height: 1.05; border-radius: var(--r-md); background: var(--tile-fill); }
.data-caixa strong { font-family: var(--font-display); font-size: 1.375rem; }
.data-caixa span { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--live-text); }
.proximo-texto { flex: 1; min-width: 150px; display: grid; gap: 2px; }
.proximo-texto strong { font-size: 0.9375rem; }
@media (min-width: 768px) {
  .bento { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s-4); }
  .mosaico-direto { grid-column: span 4; padding: var(--s-6); }
  .mosaico-produtor, .mosaico-epoca { grid-column: span 2; }
  .mosaico-proximo, .mosaico-categorias { grid-column: span 4; }
  .categorias { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .lote-ilustracao { display: block; }
  .mosaico-epoca .ilus { height: 58px; }
  .mosaico-epoca .ilus svg { width: 58px; height: 58px; }
  .grelha-produtos { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s-8) var(--s-4); }
}
@media (min-width: 1024px) {
  .inicio-topo { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: end; column-gap: var(--s-10); }
  .mosaico-direto { grid-column: 1 / 3; grid-row: 1 / 3; min-height: 380px; }
  .mosaico-direto h2 { font-size: 2rem; }
  .mosaico-produtor { grid-column: 3; grid-row: 1; }
  .mosaico-epoca { grid-column: 4; grid-row: 1; }
  .mosaico-proximo { grid-column: 3 / 5; grid-row: 2; }
  .mosaico-categorias { grid-column: 1 / -1; }
}
@media (min-width: 1280px) {
  .grelha-produtos { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}

/* ---------- Catálogo ---------- */
.catalogo { display: grid; gap: var(--s-5); }
.catalogo-principal { display: grid; gap: var(--s-4); min-width: 0; }
.catalogo-cabecalho { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s-3); }
.barra-ferramentas { display: flex; align-items: center; gap: var(--s-2); }
.contagem-filtros {
  min-width: 22px; height: 22px; padding: 0 6px; border-radius: var(--r-full); display: inline-grid; place-items: center;
  background: var(--brand); color: var(--on-brand); font-size: 0.75rem; font-weight: 800;
}
.ordenar {
  margin-left: auto; max-width: 60%; height: 44px; padding: 0 12px; border-radius: var(--r-full);
  border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-weight: 650; font-size: var(--t-small);
}
.resultado { font-size: var(--t-small); font-weight: 650; color: var(--text-muted); }
.lateral-filtros { display: none; }
.vazio {
  display: grid; justify-items: center; gap: var(--s-3); text-align: center;
  padding: var(--s-10) var(--s-5); border-radius: var(--r-xl); background: var(--tile);
}
.vazio svg { width: 96px; height: 96px; }
@media (min-width: 768px) {
  .chips-rolagem { margin-inline: -24px; padding-inline: 24px; scroll-padding-inline: 24px; }
}
@media (min-width: 1024px) {
  .catalogo { grid-template-columns: 290px minmax(0, 1fr); align-items: start; column-gap: var(--s-8); }
  .lateral-filtros {
    display: grid; gap: var(--s-6); position: sticky; top: calc(var(--topo-h) + 24px);
    padding: var(--s-5); border-radius: var(--r-xl); background: var(--tile);
  }
  .lateral-filtros .chip { background: var(--tile-fill); }
  .lateral-filtros .chip[aria-pressed="true"] { background: var(--brand); }
  .btn-filtros { display: none; }
  .chips-rolagem { margin-inline: 0; padding-inline: 0; flex-wrap: wrap; overflow: visible; }
}

/* ---------- Produto ---------- */
.produto { display: grid; gap: var(--s-5); }
.voltar {
  display: inline-flex; align-items: center; gap: 4px; width: fit-content; height: 40px; padding: 0 14px 0 8px;
  border: 0; border-radius: var(--r-full); background: var(--fill); font-weight: 700; font-size: var(--t-small);
}
.voltar:hover { background: var(--fill-hover); }
.produto-heroi {
  position: relative; display: grid; place-items: center; overflow: hidden; max-width: 100%;
  aspect-ratio: 4 / 3; border-radius: var(--r-xl); background: var(--cat);
}
.produto-heroi svg { width: 58%; height: 58%; }
.produto-heroi .etiquetas { position: absolute; top: 14px; left: 14px; display: flex; gap: 6px; }
.produto-info { display: grid; gap: var(--s-4); align-content: start; }
.produto-info h1 { font-size: 2rem; }
.linha-produtor { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: var(--t-small); font-weight: 650; }
.linha-produtor .avatar { width: 30px; height: 30px; font-size: 0.6875rem; }
.preco-grande { font-size: 2.125rem; font-weight: 800; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; line-height: 1; }
.preco-grande small { font-size: 1rem; font-weight: 650; color: var(--text-muted); letter-spacing: 0; }
.factos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-2); }
.facto { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-md); background: var(--tile); min-width: 0; }
.facto span { font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-muted); }
.facto strong { font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.descricao { color: var(--text-muted); max-width: 62ch; }
.cartao-produtor { display: grid; gap: var(--s-3); padding: var(--s-5); border-radius: var(--r-xl); background: var(--surface); border: 1px solid var(--border); }
.cartao-produtor .cabecalho { display: flex; align-items: center; gap: var(--s-3); }
.cartao-produtor .avatar { width: 48px; height: 48px; font-size: 0.9375rem; background: var(--cat-mel); color: var(--pendente-fg); }
.verificado { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 750; color: var(--brand-text); }
.verificado .ic { font-size: 16px; font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24; }
.barra-acao {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; align-items: center; gap: var(--s-3);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px);
  border-top: 1px solid color-mix(in srgb, var(--border) 70%, transparent);
}

/* ---------- Catálogo ---------- */
const normalizar = (t) => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function filtrarProdutos() {
  const f = estado.filtros;
  const q = normalizar(f.q.trim());
  const lista = PRODUTOS.filter((p) => {
    const pr = PRODUTORES[p.produtor];
    const texto = normalizar(`${p.nome} ${p.categoria} ${p.descricao} ${pr.nome} ${pr.localidade}`);
    return (!q || texto.includes(q))
      && (!f.categorias.length || f.categorias.includes(p.categoria))
      && (!f.bio || p.bio)
      && (f.epoca === 'Todas' || p.epocas.includes(f.epoca))
      && (!f.localidades.length || f.localidades.includes(pr.localidade.split(', ').pop()))
      && p.preco <= f.precoMax;
  });
  const ordem = {
    'preco-asc': (a, b) => a.preco - b.preco,
    'preco-desc': (a, b) => b.preco - a.preco,
    perto: (a, b) => PRODUTORES[a.produtor].km - PRODUTORES[b.produtor].km,
    avaliacao: (a, b) => b.avaliacao - a.avaliacao,
  }[f.ordenar];
  return ordem ? lista.sort(ordem) : lista;
}

function filtrosAplicados() {
  const f = estado.filtros;
  const chips = [];
  if (f.q) chips.push({ tipo: 'q', valor: '', rotulo: `“${f.q}”` });
  f.categorias.forEach((c) => chips.push({ tipo: 'categoria', valor: c, rotulo: c }));
  if (f.bio) chips.push({ tipo: 'bio', valor: '', rotulo: 'Biológico' });
  if (f.epoca !== 'Todas') chips.push({ tipo: 'epoca', valor: '', rotulo: f.epoca });
  f.localidades.forEach((l) => chips.push({ tipo: 'localidade', valor: l, rotulo: l }));
  if (f.precoMax < 10) chips.push({ tipo: 'preco', valor: '', rotulo: `Até ${euro(f.precoMax)}` });
  return chips;
}

function htmlAplicados() {
  const chips = filtrosAplicados();
  if (!chips.length) return '';
  return chips.map((c) => `<button class="chip chip-removivel" type="button" data-acao="remover-filtro" data-tipo="${c.tipo}" data-valor="${esc(c.valor)}" aria-label="Remover filtro ${esc(c.rotulo)}">${esc(c.rotulo)}${icone('close', 'p')}</button>`).join('')
    + '<button class="chip" type="button" data-acao="limpar-filtros">Limpar tudo</button>';
}

function controlosFiltros(prefixo) {
  const f = estado.filtros;
  const chip = (acao, valor, ativo, rotulo = valor) => `<button class="chip" type="button" data-acao="${acao}" data-valor="${esc(valor)}" data-chave="${acao}:${esc(valor)}" aria-pressed="${ativo}">${esc(rotulo)}</button>`;
  return `
    <div class="grupo-filtro"><h3>Categoria</h3><div class="lista-chips">${CATEGORIAS.map((c) => chip('alternar-categoria', c.nome, f.categorias.includes(c.nome))).join('')}</div></div>
    <div class="grupo-filtro"><h3>Modo de produção</h3>
      <label class="interruptor" for="${prefixo}-bio">Só biológico<input id="${prefixo}-bio" type="checkbox" role="switch" data-filtro="bio" ${f.bio ? 'checked' : ''}></label></div>
    <div class="grupo-filtro"><h3>Época</h3><div class="lista-chips">${EPOCAS.map((e) => chip('escolher-epoca', e, f.epoca === e)).join('')}</div></div>
    <div class="grupo-filtro"><h3>Localidade</h3><div class="lista-chips">${LOCALIDADES.map((l) => chip('alternar-localidade', l, f.localidades.includes(l))).join('')}</div></div>

      <label class="sr-only" for="${prefixo}-preco">Preço máximo</label>

      <p class="resultado"><span data-saida-preco>${f.precoMax >= 10 ? 'Sem limite' : `Até ${euro(f.precoMax)}`}</span></p></div>`;

const lerValor = (t) => Number(String(t).replace(/[^\d,.-]/g, '').replace(',', '.'));
const valorCampo = (v) => fmtNum(Number(v), 2);

function htmlLider() {
  const l = leilao.licitacoes[0];
  if (!l) return '<span class="lider">Ainda sem licitações</span>';

  return `<span class="lider"><span class="avatar ${corDe(l.nome)}" aria-hidden="true">${iniciais(l.nome)}</span>${esc(l.nome)} lidera</span>`;
}

function htmlLicitacoes(nova = false) {

    <span class="avatar ${corDe(l.eu ? EU : l.nome)}" aria-hidden="true">${iniciais(l.eu ? EU : l.nome)}</span>

    <span class="valor">${euro(l.valor)}</span></li>`).join('');

    <p>${l ? `${venci ? 'A sua licitação' : esc(l.nome)} venceu com ${euro(l.valor)}.` : 'Terminou sem licitações.'}${venci ? ' A encomenda do lote já está em Encomendas.' : ''}</p>

      ${e.linhas.map((l) => `<div class="linha-encomenda"><span>${fmtQ(l)} × ${esc(l.nome)}</span><span class="num">${euro(l.q * l.preco)}</span></div>`).join('')}

/* ---------- Navegação (SPA) com View Transitions ---------- */
const VISTAS = {
  inicio: vistaInicio, produtos: vistaProdutos, produto: vistaProduto, leilao: vistaLeilao, encomendas: vistaEncomendas,
  carrinho: vistaCarrinho, produtor: vistaProdutor, perfil: vistaPerfil, sistema: vistaSistema,
};
const NAV_ATIVA = { produto: 'produtos', produtor: 'produtos', perfil: '', sistema: '' };
const raiz = document.documentElement;
const main = document.getElementById('conteudo');
const folha = document.getElementById('folha-filtros');
const ENCOMENDAS_INICIAIS = JSON.parse(JSON.stringify(encomendas));
const LICITACOES_INICIAIS = leilao.licitacoes.map((l) => ({ ...l, em: l.em - agora }));

function render() {
  main.innerHTML = (VISTAS[estado.vista] || vistaInicio)(estado.param);
  raiz.toggleAttribute('data-detalhe', estado.vista === 'produto');
  const ativa = estado.vista in NAV_ATIVA ? NAV_ATIVA[estado.vista] : estado.vista;
  document.querySelectorAll('[data-nav]').forEach((el) => {
    if (el.dataset.nav === ativa) el.setAttribute('aria-current', 'page');
    else el.removeAttribute('aria-current');
  });
  atualizarContadores();
  if (estado.vista === 'encomendas') agendarNotificacao();
}

function transicao(alterar) {
  if (!document.startViewTransition || reduzirMovimento()) { alterar(); return Promise.resolve(); }
  return document.startViewTransition(alterar).finished.catch(() => {});
}

function ir(vista, param = null, { voltar = false, scroll = 0, origem = null } = {}) {
  if (!voltar) estado.pilha.push({ vista: estado.vista, param: estado.param, scroll: window.scrollY });
  const anterior = { vista: estado.vista, param: estado.param };
  if (folha.open) folha.close();
  if (origem) origem.style.viewTransitionName = 'heroi';
  transicao(() => {
    estado.vista = vista;
    estado.param = param;
    if (vista === 'produto' && !voltar) estado.qtdDetalhe = 1;
    render();
    // Ao regressar de um produto, o cartão desse produto recebe o mesmo nome para "encolher" de volta
    if (voltar && anterior.vista === 'produto') {
      const cartao = main.querySelector(`[data-ilu="${anterior.param}"]`);
      if (cartao) cartao.style.viewTransitionName = 'heroi';
    }
    window.scrollTo(0, voltar ? scroll : 0);
  }).then(() => main.querySelectorAll('[data-ilu]').forEach((el) => { el.style.viewTransitionName = ''; }));
  main.focus({ preventScroll: true });
}

function voltar() {
  const anterior = estado.pilha.pop();
  if (!anterior) { ir('inicio', null, { voltar: true }); return; }
  ir(anterior.vista, anterior.param, { voltar: true, scroll: anterior.scroll });
}

/* ---------- Tema claro e escuro (revelação circular a partir do botão) ---------- */
function temaEfetivo() {
  return raiz.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function atualizarBotaoTema() {
  const escuro = temaEfetivo() === 'dark';
  const botao = document.querySelector('[data-acao="tema"]');
  botao.setAttribute('aria-label', escuro ? 'Mudar para modo claro' : 'Mudar para modo escuro');
  botao.querySelector('[data-icone-tema]').textContent = escuro ? 'light_mode' : 'dark_mode';
}
function aplicarModo(modo) {
  if (modo === 'auto') raiz.removeAttribute('data-theme');
  else raiz.setAttribute('data-theme', modo);
  gravarArmazenamento('dcm-tema', modo);
  atualizarBotaoTema();
  document.querySelectorAll('[data-acao="aparencia"]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.valor === modo));
  if (estado.vista === 'sistema') main.innerHTML = vistaSistema();
}
function mudarTema(modo, origem) {
  if (!document.startViewTransition || reduzirMovimento()) { aplicarModo(modo); return; }
  const r = origem ? origem.getBoundingClientRect() : null;
  const x = r ? r.left + r.width / 2 : innerWidth / 2;
  const y = r ? r.top + r.height / 2 : 0;
  raiz.style.setProperty('--rx', `${x}px`);
  raiz.style.setProperty('--ry', `${y}px`);
  raiz.style.setProperty('--rr', `${Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y))}px`);
  raiz.classList.add('tema-transicao');
  document.startViewTransition(() => aplicarModo(modo)).finished.finally(() => raiz.classList.remove('tema-transicao'));
}

/* ---------- Avisos (toasts) e anúncios para leitores de ecrã ---------- */
const avisos = document.getElementById('avisos');
function aviso(html, { ic = 'check_circle', acao = null } = {}) {
  const el = document.createElement('div');
  el.className = 'aviso';
  el.innerHTML = `${icone(ic, 'cheio')}<p>${html}</p>${acao ? `<button class="aviso-acao" type="button">${esc(acao.rotulo)}</button>` : ''}`;
  const fechar = () => { el.classList.add('sair'); setTimeout(() => el.remove(), 200); };
  if (acao) el.querySelector('.aviso-acao').addEventListener('click', () => { fechar(); acao.fn(); });
  avisos.prepend(el);
  while (avisos.children.length > 3) avisos.lastElementChild.remove();
  setTimeout(fechar, acao ? 6000 : 4000);
}
function anunciar(texto) {
  const a = document.getElementById('anunciador');
  a.textContent = '';
  setTimeout(() => { a.textContent = texto; }, 60);
}
function saltinho(el) {
  if (!el || reduzirMovimento()) return;
  el.classList.remove('saltinho');
  void el.offsetWidth;
  el.classList.add('saltinho');
}

/* ---------- Carrinho ---------- */
function atualizarContadores(animar = false) {
  const n = estado.carrinho.length;
  document.querySelectorAll('[data-contador-carrinho]').forEach((el) => {
    el.textContent = n;
    el.hidden = n === 0;
    if (animar) saltinho(el);
  });
}
function adicionar(id, q = 1) {
  const linha = estado.carrinho.find((l) => l.id === id);
  if (linha) linha.q += q;
  else estado.carrinho.push({ id, q });
  atualizarContadores(true);
  aviso(`<strong>${esc(produto(id).nome)}</strong> está no carrinho.`, { ic: 'shopping_bag', acao: { rotulo: 'Ver carrinho', fn: () => ir('carrinho') } });
}
function encomendar() {
  const grupos = {};
  estado.carrinho.forEach((l) => {
    const p = produto(l.id);
    (grupos[p.produtor] ||= []).push({ nome: p.nome, q: l.q, unidade: p.unidade, preco: p.preco });
  });
  let n = 1043 + Math.floor(Math.random() * 40);
  Object.entries(grupos).forEach(([pid, linhas]) => encomendas.unshift({
    id: `DCM-${n++}`, produtor: pid, data: 'hoje', estado: 'pendente', tipo: estado.entrega, linhas,
    morada: estado.entrega === 'levantamento' ? `Levantar na quinta: ${PRODUTORES[pid].nome}, ${PRODUTORES[pid].localidade}` : 'Entrega em casa: Rua do Lima 21, Ponte de Lima',
  }));
  const k = Object.keys(grupos).length;
  estado.carrinho = [];
  atualizarContadores(true);
  aviso(`${k} ${k === 1 ? 'encomenda enviada' : 'encomendas enviadas'} aos produtores.`, { ic: 'package_2' });
  ir('encomendas');
}

/* ---------- Filtros: um só estado, vários controlos (folha e barra lateral) ---------- */
function sincronizarControlos(excepto = null) {
  const f = estado.filtros;
  document.querySelectorAll('[data-acao="alternar-categoria"]').forEach((b) => b.setAttribute('aria-pressed', f.categorias.includes(b.dataset.valor)));
  document.querySelectorAll('[data-acao="escolher-epoca"]').forEach((b) => b.setAttribute('aria-pressed', f.epoca === b.dataset.valor));
  document.querySelectorAll('[data-acao="alternar-localidade"]').forEach((b) => b.setAttribute('aria-pressed', f.localidades.includes(b.dataset.valor)));
  document.querySelectorAll('[data-filtro="bio"]').forEach((i) => { if (i !== excepto) i.checked = f.bio; });
  document.querySelectorAll('[data-filtro="preco"]').forEach((i) => { if (i !== excepto) i.value = f.precoMax; });
  document.querySelectorAll('[data-saida-preco]').forEach((o) => { o.textContent = f.precoMax >= 10 ? 'Sem limite' : `Até ${euro(f.precoMax)}`; });
  document.querySelectorAll('[data-form-pesquisa] input[name="q"]').forEach((i) => { if (i !== document.activeElement) i.value = f.q; });
}
function atualizarResultados() {
  const n = filtrarProdutos().length;
  const ativos = filtrosAplicados().length;
  const texto = `${n} ${n === 1 ? 'produto' : 'produtos'}`;
  const resultados = main.querySelector('[data-resultados]');
  if (resultados) resultados.innerHTML = htmlResultados();
  const aplicados = main.querySelector('[data-aplicados]');
  if (aplicados) aplicados.innerHTML = htmlAplicados();
  const contagem = main.querySelector('[data-contagem]');
  if (contagem) contagem.textContent = texto;
  const nFiltros = main.querySelector('[data-n-filtros]');
  if (nFiltros) { nFiltros.textContent = ativos; nFiltros.hidden = !ativos; }
  const ver = folha.querySelector('[data-ver-n]');
  if (ver) ver.textContent = `Ver ${texto}`;
}
function alternar(lista, valor) {
  const i = lista.indexOf(valor);
  if (i >= 0) lista.splice(i, 1);
  else lista.push(valor);
}
function limparFiltros() {
  estado.filtros = { ...estado.filtros, q: '', categorias: [], bio: false, epoca: 'Todas', localidades: [], precoMax: 10 };
}
function removerFiltro(tipo, valor) {
  const f = estado.filtros;
  if (tipo === 'q') f.q = '';
  if (tipo === 'categoria') alternar(f.categorias, valor);
  if (tipo === 'bio') f.bio = false;
  if (tipo === 'epoca') f.epoca = 'Todas';
  if (tipo === 'localidade') alternar(f.localidades, valor);
  if (tipo === 'preco') f.precoMax = 10;
}

/* ---------- Leilão simulado (no projeto real, isto vem do Socket.io) ---------- */
let temporizadorRival = null;
function agendarRival() {
  clearTimeout(temporizadorRival);
  if (leilao.terminado) return;
  temporizadorRival = setTimeout(() => { licitacaoRival(); agendarRival(); }, 5000 + Math.random() * 6000);
}
function licitacaoRival() {
  if (leilao.terminado) return;
  const anterior = leilao.licitacoes[0];
  const candidatos = RIVAIS.filter((n) => !anterior || n !== anterior.nome);
  const nome = candidatos[Math.floor(Math.random() * candidatos.length)];
  const valor = atualLeilao() + leilao.incremento * (Math.random() < 0.7 ? 1 : 2);
  leilao.participantes = Math.max(9, leilao.participantes + (Math.random() < 0.5 ? -1 : 1));
  registarLicitacao({ nome, valor, em: Date.now() });
  if (anterior && anterior.eu) {
    aviso(`<strong>${esc(nome)}</strong> ultrapassou a sua licitação com ${euro(valor)}.`, {
      ic: 'gavel', acao: estado.vista === 'leilao' ? null : { rotulo: 'Ver sala', fn: () => ir('leilao') },
    });
  }
}
function registarLicitacao(l) {
  leilao.licitacoes.unshift(l);
  atualizarLeilaoUI(true);
}
function atualizarBotaoLicitar() {
  const valor = estado.valorLicitacao ?? minimoLicitacao();
  const rotulo = main.querySelector('[data-valor-botao]');
  if (rotulo) rotulo.textContent = euro(valor);
  main.querySelectorAll('[data-acao="atalho"]').forEach((b) => b.setAttribute('aria-pressed', Number(b.dataset.valor) === valor));
}
function atualizarLeilaoUI(nova = false) {
  const atual = atualLeilao();
  const min = minimoLicitacao();
  document.querySelectorAll('[data-atual]').forEach((el) => { el.textContent = euro(atual); if (nova) saltinho(el); });
  document.querySelectorAll('[data-participantes]').forEach((el) => { el.textContent = leilao.participantes; });
  const lider = main.querySelector('[data-lider]');
  if (lider) lider.innerHTML = htmlLider();
  const lista = main.querySelector('[data-licitacoes]');
  if (lista) lista.innerHTML = htmlLicitacoes(nova);
  const porKg = main.querySelector('[data-por-kg]');
  if (porKg) porKg.textContent = euro(atual / leilao.kg);
  const zona = main.querySelector('[data-zona-licitar]');
  if (zona) {
    if (leilao.terminado) { zona.innerHTML = htmlZonaLicitar(); return; }
    if ((estado.valorLicitacao ?? 0) < min) estado.valorLicitacao = min;
    zona.querySelector('[data-minimo]').textContent = euro(min);
    zona.querySelectorAll('[data-acao="atalho"]').forEach((b, i) => { b.dataset.valor = atual + [1, 2, 5][i] * leilao.incremento; });
    const campo = zona.querySelector('[data-valor-licitacao]');
    if (campo && document.activeElement !== campo) campo.value = valorCampo(estado.valorLicitacao);
    atualizarBotaoLicitar();
  }
  if (nova && estado.vista === 'leilao') {
    const l = leilao.licitacoes[0];
    anunciar(`Nova licitação de ${euro(l.valor)}${l.eu ? ', a sua' : ` por ${l.nome}`}.`);
  }
}
function mostrarErroLicitacao(texto) {
  const caixa = main.querySelector('[data-erro-licitacao]');
  if (caixa) caixa.innerHTML = `<p class="alerta alerta-erro tremer" role="alert">${icone('info', 'm')}${esc(texto)}</p>`;
}
function licitar(botao) {
  if (leilao.terminado || estado.aguardaLicitacao) return;
  const campo = main.querySelector('[data-valor-licitacao]');
  const valor = lerValor(campo ? campo.value : estado.valorLicitacao);
  const min = minimoLicitacao();
  if (!Number.isFinite(valor) || valor < min) { mostrarErroLicitacao(`O valor mínimo é ${euro(min)}.`); return; }
  estado.aguardaLicitacao = true;
  botao.setAttribute('aria-busy', 'true');
  botao.disabled = true;
  setTimeout(() => {
    estado.aguardaLicitacao = false;
    // Uma em cada quatro vezes, outro comprador chega primeiro com o mesmo valor:
    // o servidor (operação atómica) aceita só a primeira e recusa a segunda.
    if (Math.random() < 0.25) {
      const rival = RIVAIS[Math.floor(Math.random() * RIVAIS.length)];
      registarLicitacao({ nome: rival, valor, em: Date.now() });
      estado.valorLicitacao = minimoLicitacao();
      atualizarLeilaoUI(false);
      mostrarErroLicitacao(`${rival} licitou ${euro(valor)} primeiro. O mínimo agora é ${euro(minimoLicitacao())}.`);
    } else {
      registarLicitacao({ nome: EU, valor, em: Date.now(), eu: true });
      estado.valorLicitacao = minimoLicitacao();
      atualizarLeilaoUI(false);
      const caixa = main.querySelector('[data-erro-licitacao]');
      if (caixa) caixa.innerHTML = '';
      aviso(`Licitação aceite: <strong>${euro(valor)}</strong>. É a mais alta.`, { ic: 'gavel' });
      try { navigator.vibrate?.(12); } catch { /* sem vibração */ }
    }
    const b = main.querySelector('[data-acao="licitar"]');
    if (b) { b.disabled = false; b.removeAttribute('aria-busy'); }
  }, 350 + Math.random() * 300);
}
function terminarLeilao() {
  leilao.terminado = true;
  clearTimeout(temporizadorRival);
  const l = leilao.licitacoes[0];
  if (l && l.eu) {
    encomendas.unshift({
      id: 'DCM-1101', produtor: leilao.produtor, data: 'hoje', estado: 'confirmada', tipo: 'levantamento',
      morada: 'Levantar na quinta: Rua da Ribeira 14, Ponte de Lima',
      linhas: [{ nome: `Lote: ${leilao.lote}`, q: 1, unidade: 'lote', preco: l.valor }],
    });
    aviso(`Ganhou o lote por <strong>${euro(l.valor)}</strong>. A encomenda já está em Encomendas.`, { ic: 'emoji_events', acao: { rotulo: 'Ver', fn: () => ir('encomendas') } });
  } else {
    aviso('O leilão do kiwi terminou.', { ic: 'schedule' });
  }
  atualizarLeilaoUI(false);
}
function reiniciarLeilao() {
  leilao.terminaEm = Date.now() + (4 * 60 + 30) * 1000;
  leilao.licitacoes = LICITACOES_INICIAIS.map((l) => ({ ...l, em: Date.now() + l.em }));
  leilao.terminado = false;
  leilao.participantes = 14;
  estado.valorLicitacao = null;
  agendarRival();
  if (estado.vista === 'leilao' || estado.vista === 'inicio') render();
}
function tique() {
  const resto = leilao.terminaEm - Date.now();
  document.querySelectorAll('[data-tempo]').forEach((el) => {
    el.textContent = fmtTempo(resto);
    el.classList.toggle('urgente', resto < 60000);
  });
  document.querySelectorAll('[data-anel]').forEach((el) => el.setAttribute('stroke-dashoffset', offsetAnel()));
  document.querySelectorAll('[data-ha]').forEach((el) => { el.textContent = haQuanto(Number(el.dataset.ha)); });
  if (resto <= 0 && !leilao.terminado) terminarLeilao();
}

/* ---------- Notificação da encomenda (no projeto real chega pela sala pessoal do Socket.io) ---------- */
let temporizadorNotificacao = null;
function agendarNotificacao() {
  const e = encomendas.find((x) => x.id === 'DCM-1042');
  if (!e || e.estado !== 'confirmada' || estado.notificacaoFeita) return;
  clearTimeout(temporizadorNotificacao);
  temporizadorNotificacao = setTimeout(() => {
    e.estado = 'pronta';
    estado.notificacaoFeita = true;
    document.querySelector('[data-ponto-notif]').hidden = false;
    aviso('<strong>Horta da Ribeira</strong> marcou a encomenda #DCM-1042 como pronta a levantar.', {
      ic: 'notifications', acao: estado.vista === 'encomendas' ? null : { rotulo: 'Ver', fn: () => ir('encomendas') },
    });
    const cartao = main.querySelector('[data-encomenda="DCM-1042"]');
    if (cartao) {
      cartao.outerHTML = cartaoEncomenda(e);
      main.querySelector('[data-encomenda="DCM-1042"]')?.classList.add('realce');
    }
  }, 3000);
}

function repor() {
  estado.carrinho = [{ id: 'p2', q: 1 }, { id: 'p1', q: 2 }, { id: 'p4', q: 3 }];
  limparFiltros();
  estado.filtros.ordenar = 'recomendados';
  estado.notificacaoFeita = false;
  estado.pilha = [];
  encomendas.splice(0, encomendas.length, ...JSON.parse(JSON.stringify(ENCOMENDAS_INICIAIS)));
  document.querySelector('[data-ponto-notif]').hidden = true;
  reiniciarLeilao();
  aviso('Demonstração reposta.', { ic: 'restart_alt' });
  ir('inicio');
}

/* ---------- Eventos (delegação num só sítio) ---------- */
document.addEventListener('click', (e) => {
  const destino = e.target.closest('[data-ir]');
  if (destino) {
    e.preventDefault();
    const vista = destino.dataset.ir;
    const param = destino.dataset.param || null;
    if (vista === estado.vista && param === estado.param) return;
    const origem = vista === 'produto' ? destino.closest('.cartao-produto')?.querySelector('[data-ilu]') : null;
    ir(vista, param, { origem });
    return;
  }
  const b = e.target.closest('[data-acao]');
  if (!b) return;
  const f = estado.filtros;
  switch (b.dataset.acao) {
    case 'tema': mudarTema(temaEfetivo() === 'dark' ? 'light' : 'dark', b); break;
    case 'aparencia': mudarTema(b.dataset.valor, b); break;
    case 'notificacoes':
      document.querySelector('[data-ponto-notif]').hidden = true;
      aviso(estado.notificacaoFeita ? 'A encomenda #DCM-1042 está pronta a levantar na Horta da Ribeira.' : 'Não tem notificações novas.', { ic: 'notifications' });
      break;
    case 'adicionar': saltinho(b); adicionar(b.dataset.id); break;
    case 'adicionar-detalhe': adicionar(b.dataset.id, estado.qtdDetalhe); break;
    case 'menos':
    case 'mais': {
      const passo = b.dataset.acao === 'mais' ? 1 : -1;
      const chave = b.dataset.chave;
      if (chave === 'qtd') {
        estado.qtdDetalhe = Math.min(20, Math.max(1, estado.qtdDetalhe + passo));
        main.querySelector('[data-saida="qtd"]').textContent = estado.qtdDetalhe;
        main.querySelector('[data-total-detalhe]').textContent = euro(produto(estado.param).preco * estado.qtdDetalhe);
      } else {
        const id = chave.slice(2);
        const linha = estado.carrinho.find((l) => l.id === id);
        if (linha) linha.q += passo;
        estado.carrinho = estado.carrinho.filter((l) => l.q > 0);
        main.innerHTML = vistaCarrinho();
        atualizarContadores();
        main.querySelector(`[data-chave="${chave}"][data-acao="${b.dataset.acao}"]`)?.focus();
      }
      break;
    }
    case 'filtrar-categoria': limparFiltros(); estado.filtros.categorias.push(b.dataset.categoria); ir('produtos'); break;
    case 'filtrar-epoca': limparFiltros(); estado.filtros.epoca = b.dataset.epoca; ir('produtos'); break;
    case 'lembrar': {
      const ativo = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', ativo);
      b.querySelector('span:last-child').textContent = ativo ? 'Vou avisar' : 'Lembrar-me';
      b.classList.toggle('btn-suave', ativo);
      b.classList.toggle('btn-secundario', !ativo);
      if (ativo) aviso('Avisamos quando o leilão abrir, no sábado às 18:00.', { ic: 'notifications' });
      break;
    }
    case 'abrir-folha': folha.innerHTML = conteudoFolha(); folha.showModal(); break;
    case 'fechar-folha': folha.close(); break;
    case 'alternar-categoria': alternar(f.categorias, b.dataset.valor); sincronizarControlos(); atualizarResultados(); break;
    case 'alternar-localidade': alternar(f.localidades, b.dataset.valor); sincronizarControlos(); atualizarResultados(); break;
    case 'escolher-epoca': f.epoca = b.dataset.valor; sincronizarControlos(); atualizarResultados(); break;
    case 'remover-filtro': removerFiltro(b.dataset.tipo, b.dataset.valor); sincronizarControlos(); atualizarResultados(); break;
    case 'limpar-filtros': limparFiltros(); sincronizarControlos(); atualizarResultados(); break;
    case 'voltar': voltar(); break;
    case 'atalho': {
      estado.valorLicitacao = Number(b.dataset.valor);
      const campo = main.querySelector('[data-valor-licitacao]');
      if (campo) campo.value = valorCampo(estado.valorLicitacao);
      atualizarBotaoLicitar();
      break;
    }
    case 'licitar': licitar(b); break;
    case 'reiniciar-leilao': reiniciarLeilao(); break;
    case 'aviso-demo': aviso(esc(b.dataset.texto), { ic: 'info' }); break;
    case 'avaliar': {
      const enc = encomendas.find((x) => x.id === b.dataset.id);
      enc.avaliacao = Number(b.dataset.n);
      main.querySelector(`[data-avaliar="${enc.id}"]`).innerHTML = htmlAvaliar(enc);
      break;
    }
    case 'entrega': estado.entrega = b.dataset.valor; main.innerHTML = vistaCarrinho(); break;
    case 'encomendar': encomendar(); break;
    case 'repor': repor(); break;
    default: break;
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if (t.matches('[data-filtro="preco"]')) {
    estado.filtros.precoMax = Number(t.value);
    sincronizarControlos(t);
    atualizarResultados();
  } else if (t.matches('[data-valor-licitacao]')) {
    const v = lerValor(t.value);
    if (Number.isFinite(v)) { estado.valorLicitacao = v; atualizarBotaoLicitar(); }
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.matches('[data-filtro="bio"]')) { estado.filtros.bio = t.checked; sincronizarControlos(t); atualizarResultados(); }
  if (t.matches('[data-filtro="ordenar"]')) { estado.filtros.ordenar = t.value; atualizarResultados(); }
});
document.addEventListener('submit', (e) => {
  const form = e.target.closest('[data-form-pesquisa]');
  if (!form) return;
  e.preventDefault();
  estado.filtros.q = String(new FormData(form).get('q') || '').trim();
  if (estado.vista === 'produtos') { sincronizarControlos(); atualizarResultados(); } else ir('produtos');
});
folha.addEventListener('click', (e) => { if (e.target === folha) folha.close(); });

/* ---------- Arranque ---------- */
(function iniciar() {
  const modo = lerArmazenamento('dcm-tema');
  if (modo === 'light' || modo === 'dark') raiz.setAttribute('data-theme', modo);
  atualizarBotaoTema();
  const alvo = (location.hash || '').slice(1);
  if (VISTAS[alvo] && alvo !== 'produto' && alvo !== 'produtor') estado.vista = alvo;
  render();
  agendarRival();
  setInterval(tique, 1000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    atualizarBotaoTema();
    if (estado.vista === 'sistema') main.innerHTML = vistaSistema();
  });
}());
</script>
